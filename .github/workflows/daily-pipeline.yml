name: Daily pipeline

on:
  schedule:
    - cron: '0 7 * * *'   # 7 AM UTC every day (3 AM Eastern)
  workflow_dispatch:       # lets you trigger manually from GitHub UI anytime

permissions:
  contents: write          # needed to commit and push the updated JSON files

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # Step 1: fetch fresh wastewater data from CDC NWSS API
      # Updates data/pipeline/disease-activity.json (Tier A: COVID, flu, RSV, norovirus)
      # Exports public/downloads/wastewater_*.csv
      - name: Fetch wastewater data
        run: python pipeline/fetch_wastewater.py

      # Step 2: recompute all threat levels using the updated Tier A data
      # Applies seasonal month logic (tick diseases drop in November, etc.)
      # Writes data/pipeline/county-threats.json → Vercel rebuilds map colors
      - name: Compute threat levels
        run: python pipeline/compute_levels.py

      # Uses stefanzweifel/git-auto-commit-action which handles shallow clones,
      # race conditions, and retries automatically — much more robust than
      # manual git fetch/rebase/push.
      - name: Commit and push if data changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: daily pipeline update"
          file_pattern: >-
            data/pipeline/disease-activity.json
            data/pipeline/county-threats.json
            data/pipeline/metadata.json
            public/downloads/wastewater_by_county_latest.csv
            public/downloads/wastewater_history.csv
            public/downloads/README.md
