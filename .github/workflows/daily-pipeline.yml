name: Daily pipeline

on:
  schedule:
    - cron: '0 7 * * *'   # 7 AM UTC every day (3 AM Eastern)
  workflow_dispatch:       # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch wastewater data
        run: python pipeline/fetch_wastewater.py

      - name: Compute threat levels
        run: python pipeline/compute_levels.py

      - name: Diagnostics
        run: |
          echo "=== Workflow file tail (confirms which version is running) ==="
          tail -20 .github/workflows/daily-pipeline.yml
          echo "=== Local HEAD ==="
          git log --oneline -3
          echo "=== Remote HEAD ==="
          git ls-remote origin HEAD
          echo "=== Fetch latest ==="
          git fetch origin main
          echo "=== Commits we are behind ==="
          git rev-list HEAD..origin/main --count
          echo "=== Files changed by pipeline ==="
          git status --short

      - name: Commit and push if data changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: daily pipeline update"
          file_pattern: >-
            data/pipeline/disease-activity.json
            data/pipeline/county-threats.json
            data/pipeline/metadata.json
            public/downloads/wastewater_by_county_latest.csv
            public/downloads/wastewater_history.csv
            public/downloads/README.md